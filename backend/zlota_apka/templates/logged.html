<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sukces | Złoty Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes scale-up {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-success {
            animation: scale-up 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="bg-[#0f172a] flex items-center justify-center min-h-screen overflow-hidden">

    <div class="absolute inset-0 overflow-hidden">
        <div class="absolute -top-[10%] -left-[10%] w-[60%] h-[40%] rounded-full bg-blue-900/20 blur-[100px]"></div>
        <div class="absolute -bottom-[10%] -right-[10%] w-[60%] h-[40%] rounded-full bg-indigo-900/20 blur-[100px]"></div>
    </div>

    <div class="relative z-10 text-center px-6">
        <div class="animate-success flex justify-center mb-8">
            <div class="w-24 h-24 bg-green-500/20 border border-green-500/50 rounded-full flex items-center justify-center shadow-[0_0_40px_rgba(34,197,94,0.2)]">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
            </div>
        </div>

        <h1 class="text-white text-3xl font-bold mb-3 tracking-tight">Zalogowano!</h1>
        <p class="text-slate-400 text-lg mb-10">Weryfikacja biometryczna przebiegła pomyślnie.</p>

      
        
        <p class="mt-6 text-slate-500 text-sm uppercase tracking-widest font-semibold opacity-50">
            Złoty Portal Mobile
        </p>
    </div>

</body>
</html>
